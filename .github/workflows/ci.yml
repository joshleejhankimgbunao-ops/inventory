name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 5000
      API_HOST: 127.0.0.1
      MONGO_URI: mongodb://127.0.0.1:27017/inventory-ci
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGIN: http://localhost:5173
      RESET_URL_BASE: http://localhost:5173
      PASSWORD_RESET_PATH: /reset-password
      PIN_RESET_PATH: /reset-pin
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 587
      MAIL_USER: mailer@example.com
      MAIL_PASS: placeholder
      MAIL_FROM: Inventory App <no-reply@example.com>
      SMOKE_BASE_URL: http://127.0.0.1:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Generate ephemeral security inputs
        shell: bash
        run: |
          node -e "const c=require('crypto');const f=require('fs');const p='Ci!'+c.randomBytes(18).toString('base64url');const n=String(c.randomInt(100000,1000000));const j=c.randomBytes(32).toString('base64url');const u='ci-superadmin';f.appendFileSync(process.env.GITHUB_ENV,['JWT_SECRET='+j,'SEED_SUPERADMIN_USERNAME='+u,'SEED_SUPERADMIN_PASSWORD='+p,'SEED_SUPERADMIN_PIN='+n,'SMOKE_USERNAME='+u,'SMOKE_PASSWORD='+p,'SMOKE_PIN='+n,'TEST_USERNAME='+u,'TEST_PASSWORD='+p,'TEST_PIN='+n,''].join('\n'))"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Seed backend database
        run: npm --prefix server run seed:reset

      - name: Ensure smoke user credentials
        run: |
          node server/scripts/createOwner.js
          node server/scripts/setOwnerPin.js

      - name: Start backend API
        run: |
          npm --prefix server run start > server.log 2>&1 &
          sleep 6

      - name: Run integration auth flow test
        run: npm --prefix server run test:auth-flow

      - name: Run full verification
        run: npm run verify:full

      - name: Show backend logs on failure
        if: failure()
        run: cat server.log
